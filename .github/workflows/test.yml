name: Test

# Runs the test suite for the self-hosted Python resolver.
#
#   test_smoke.py          imports, factory, HTTP endpoints, synthetic fixtures
#   test_real_registry.py  the resolver against the REAL registry
#                          (CloudSecurityAlliance/SecID main) plus the shared
#                          fixtures in CloudSecurityAlliance/SecID-Client-SDK,
#                          with expectations taken from the live resolver
#
# Both sibling repos are public and checked out read-only at their default
# branch, so a registry change that breaks this resolver shows up on the next
# run here.
#
# Actions are pinned by commit SHA (tag in the trailing comment).
#
# TypeScript and Go implementations are README-stubs today; their CI jobs
# will be added when those implementations land.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      SECID_REGISTRY_DIR: ${{ github.workspace }}/_deps/SecID/registry
      SECID_CLIENT_SDK_DIR: ${{ github.workspace }}/_deps/SecID-Client-SDK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout SecID registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CloudSecurityAlliance/SecID
          path: _deps/SecID
          persist-credentials: false
      - name: Checkout SecID-Client-SDK fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CloudSecurityAlliance/SecID-Client-SDK
          path: _deps/SecID-Client-SDK
          persist-credentials: false
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: python
        run: |
          pip install -r requirements.txt
          # mcp is optional at runtime; installed here so the /mcp tests run.
          pip install pytest httpx mcp
      - name: Run tests
        working-directory: python
        run: pytest -v -rs
